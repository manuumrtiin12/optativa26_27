<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola que pasa</title>
</head>
<body>

    <script>

        var fechaActual = new Date("2005/02/12"); 

        document.write("Dia: " + fechaActual.getDate() + "<br>");
        document.write("Mes: " + (fechaActual.getMonth() + 1) + "<br>");
        document.write("Año: " + fechaActual.getFullYear());

    </script>
    
</body>
</html>
