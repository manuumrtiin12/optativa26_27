<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola que pasa</title>
</head>
<body>

    <script>
        var num1 = parseInt(prompt("Dame un numero: "));
        var num2 = parseInt(prompt("Dame otro numero: "));

        alert("Suma: " + (num1 + num2));
        alert("Resta: " + (num1 - num2));
        alert("Multiplicacion: " + (num1 * num2));

        if (num2 != 0) {
            alert("Division: " + (num1 / num2));

        } else {
            alert("No se puede dividir entre 0");
            
        }
    </script>

    
</body>
</html>
