<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hol que pasa</title>
</head>
<body>

    <script>

        var elementos = parseInt(prompt("¿Cuántos elementos <p> quieres añadir?"));

        let padre = document.getElementsByTagName("h1")[0];

        for(var i = 1 ; i <= elementos ; i++) {
            var nuevoParrafo = document.createElement("p");
            nuevoParrafo.createNode = "Parrafo" + i;
            padre.appendChild(nuevoParrafo);
        }
    

    </script>
    
</body>
</html>
