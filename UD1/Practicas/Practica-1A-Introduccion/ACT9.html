<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola que pasa</title>
</head>
<body>

<script>
    let nombres = prompt("Introduce una lista de nombres separados por comas:");

    let lista = nombres.split(",");

    for (l in lista) {
        document.write("Hola " + lista[l]);
    }
</script>

</body>
</html>
