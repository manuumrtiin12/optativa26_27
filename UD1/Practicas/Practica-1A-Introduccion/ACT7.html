</head>
<body>

    <script>

        var intento1 = prompt("¿Quién es el pintor de las Meninas?");

        if(intento1 != "Velazquez") {

            var intento2 = prompt("Incorrecto ¿Quién es el pintor de las Meninas?");

            if(intento2 != "Velazquez") {

                var intento3 = prompt("Incorrecto, ultima oportunidad ¿Quién es el pintor de las Meninas?");
            }
            
            else {document.write("Correcto!")}

                document.write("Has perdido!")
            }
            
        }

        else {document.write("Correcto!")}

    </script>
