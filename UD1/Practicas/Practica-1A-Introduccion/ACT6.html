<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola que pasa</title>
</head>
<body>

    <script>

        var nivelEncabezado = prompt("Dime que nivel de encabezado quieres ver: ");

        

        if (nivelEncabezado == 1) {
            document.write("<h1>Encabezado nivel 1<h1>");}
        
        else if (nivelEncabezado == 2) {        
            document.write("<h2>Encabezado nivel 2<h2>");}
        
        else if (nivelEncabezado == 3) {        
            document.write("<h3>Encabezado nivel 3<h3>")}
        
        else {document.write("El numero no tiene nivel")}

    </script>

    
</body>
</html>
